version: '3.8'

services:
  rtk-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: rtk:dev
    container_name: rtk-dev
    # Run as current user to avoid permission issues with created files
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      # Mount source code for live development
      - .:/workspace
      # Persist Cabal cache across container restarts
      # Note: Using a named volume that works with any user
      - cabal-cache:/home/user/.cabal
      # Persist build artifacts
      - build-cache:/workspace/dist-newstyle
    working_dir: /workspace
    environment:
      # Ensure Cabal uses the correct home directory
      - HOME=/home/user
    command: /bin/bash
    stdin_open: true
    tty: true

  # Service for running tests
  test:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: rtk:dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      - cabal-cache:/home/user/.cabal
      - build-cache:/workspace/dist-newstyle
    working_dir: /workspace
    environment:
      - HOME=/home/user
    command: make test
    profiles:
      - test

  # Service for running all Java tests
  test-java:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: rtk:dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      - cabal-cache:/home/user/.cabal
      - build-cache:/workspace/dist-newstyle
    working_dir: /workspace
    environment:
      - HOME=/home/user
    command: make test-all-java
    profiles:
      - test

  # Service for building the project
  build:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: rtk:dev
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - .:/workspace
      - cabal-cache:/home/user/.cabal
      - build-cache:/workspace/dist-newstyle
    working_dir: /workspace
    environment:
      - HOME=/home/user
    command: cabal build
    profiles:
      - build

volumes:
  cabal-cache:
    driver: local
  build-cache:
    driver: local
